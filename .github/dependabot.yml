version: 2

updates:
  - package-ecosystem: bun
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
    groups:
      next:
        patterns:
          - "next"
          - "eslint-config-next"
          - "@tailwindcss/postcss"
          - "tailwindcss"
      testing:
        patterns:
          - "vitest"
          - "jsdom"
          - "@testing-library/*"
          - "playwright"
      drizzle:
        patterns:
          - "drizzle-orm"
          - "drizzle-kit"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
